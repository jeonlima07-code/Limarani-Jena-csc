<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Apply Now</title>
</head>
<body class="bg-gray-100">

    <div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg mt-10">

        <h1 class="text-3xl font-bold text-center mb-6">
            Job Application Form
        </h1>

        <form>

            <label class="font-semibold">Full Name</label>
            <input type="text"
                class="w-full border p-3 rounded-lg mb-4">

            <label class="font-semibold">Email</label>
            <input type="email"
                class="w-full border p-3 rounded-lg mb-4">

            <label class="font-semibold">Phone Number</label>
            <input type="tel"
                class="w-full border p-3 rounded-lg mb-4">

            <label class="font-semibold">Job Position</label>
            <select class="w-full border p-3 rounded-lg mb-4">
                <option>Frontend Developer</option>
                <option>UI/UX Designer</option>
                <option>Data Analyst</option>
            </select>

            <label class="font-semibold">Upload Resume</label>
            <input type="file"
                class="w-full border p-3 rounded-lg mb-4">

<button
    type="button"
    onclick="applyJob()"
    class="bg-blue-600 text-white px-6 py-3 rounded-lg w-full">
    Submit Application
</button>

        </form>

    </div>
<script src="script.js"></script>
</body>
</html>
