<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Contact Us</title>
</head>

<body class="bg-gray-100">

    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-2xl font-bold">JobPortal</h1>

            <div class="space-x-4">
                <a href="index.html">Home</a>
                <a href="jobs.html">Jobs</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-lg mt-10">

        <h1 class="text-3xl font-bold text-center mb-6">
            Contact Us
        </h1>

        <form>

            <label class="font-semibold">Name</label>
            <input
                type="text"
                class="w-full border p-3 rounded-lg mb-4">

            <label class="font-semibold">Email</label>
            <input
                type="email"
                class="w-full border p-3 rounded-lg mb-4">

            <label class="font-semibold">Message</label>
            <textarea
                rows="5"
                class="w-full border p-3 rounded-lg mb-4"></textarea>

            <button
                class="bg-blue-600 text-white px-6 py-3 rounded-lg w-full">
                Send Message
            </button>

        </form>

    </div>

</body>
</html>
